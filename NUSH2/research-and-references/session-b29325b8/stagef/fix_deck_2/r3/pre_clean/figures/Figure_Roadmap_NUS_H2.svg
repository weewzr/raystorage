<text x="535.5" y="450" font-size="20" font-weight="normal" fill="#1d2329" text-anchor="start">Reactor developers and research</text>
<text x="535.5" y="476" font-size="20" font-weight="normal" fill="#1d2329" text-anchor="start">institutes</text>
<line x1="535.5" y1="506" x2="961" y2="506" stroke="#8a55b8" stroke-width="1.5" opacity="0.5"/>
