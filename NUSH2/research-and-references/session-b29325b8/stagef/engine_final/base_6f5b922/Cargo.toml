[workspace]
members = [
    "engine/numerics",
    "engine/props",
    "engine/mea",
    "engine/units",
    "engine/plant",
    "engine/vv",
    "engine/cli",
    "engine/wasm",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seuif97 = "=2.3.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
